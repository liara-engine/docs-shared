<!--
    Liara Engine — Doxygen header template

    This template replaces Doxygen's default <head> + opening of <body>.
    Doxygen substitutes special tokens like $title, $relpath^, $treeview
    when generating each page; do not remove or rename these.
-->
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="en-US">
<head>
    <meta charset="UTF-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=9"/>
    <meta name="generator" content="Doxygen $doxygenversion"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <!--BEGIN PROJECT_NAME--><title>$projectname: $title</title><!--END PROJECT_NAME-->
    <!--BEGIN !PROJECT_NAME--><title>$title</title><!--END !PROJECT_NAME-->

    <!-- Fonts: Inter for sans, JetBrains Mono for code, OpenDyslexic for a11y -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap">

    <!--BEGIN FULL_SIDEBAR-->
    <script type="text/javascript">var page_layout=1;</script>
    <!--END FULL_SIDEBAR-->
    <!--BEGIN HTML_DYNAMIC_SECTIONS-->
    <script type="text/javascript" src="$relpath^dynsections.js"></script>
    <!--END HTML_DYNAMIC_SECTIONS-->
    <!--BEGIN HTML_CODE_FOLDING-->
    <script type="text/javascript" src="$relpath^codefolding.js"></script>
    <!--END HTML_CODE_FOLDING-->
    <!--BEGIN COPY_CLIPBOARD-->
    <script type="text/javascript" src="$relpath^clipboard.js"></script>
    <!--END COPY_CLIPBOARD-->
    <script src="$relpath^jquery.js"></script>

    <!-- Doxygen's own stylesheets, kept for layout fundamentals we override below -->
    $treeview
    $search
    $mathjax
    $darkmode
    <link href="$relpath^tabs.css" rel="stylesheet" type="text/css"/>
    <link href="$relpath^doxygen.css" rel="stylesheet" type="text/css"/>

    <link rel="icon" type="image/x-icon" href="/shared-content/assets/logo.svg">

    <!-- Liara design system, applied AFTER Doxygen's own CSS so we can override -->
    <link rel="stylesheet" href="/shared-content/tokens/design-tokens.css">
    <link rel="stylesheet" href="/shared-content/navbar/navbar.css">
    <link rel="stylesheet" href="/shared-content/doxygen/doxygen-custom.css">

    $extrastylesheet

    <!-- Apply theme/a11y prefs synchronously to prevent flash -->
    <script>
        (function () {
            try {
                const t = localStorage.getItem("liara-theme");
                if (t === "light" || t === "dark") {
                    document.documentElement.setAttribute("data-liara-theme", t);
                }
                if (localStorage.getItem("liara-a11y-dyslexia") === "true") {
                    document.documentElement.setAttribute("data-liara-a11y-dyslexia", "true");
                }
            } catch (e) { /* localStorage unavailable, fall back to defaults */ }
        })();
    </script>
</head>
<body>
