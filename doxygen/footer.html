<!--
    Liara Engine — Doxygen footer template

    Closes the wrapper started in header.html and adds a discreet footer
    line. Doxygen substitutes $generatedby and $datetime for the
    "Generated on ... by Doxygen" line.
-->

<!--BEGIN GENERATE_TREEVIEW-->
<div id="nav-path" class="navpath"><!-- id is needed for treeview function! -->
    <ul>
        $navpath
        <li class="footer">$generatedby <a href="https://www.doxygen.org/index.html"><img class="footer" src="$relpath^doxygen.svg" width="104" height="31" alt="doxygen"/></a> $doxygenversion </li>
    </ul>
</div>
<!--END GENERATE_TREEVIEW-->

<footer class="liara-doxygen-footer">
    <div class="liara-doxygen-footer__inner">
        <p class="liara-doxygen-footer__line">
            Liara Engine documentation &middot;
            <a href="https://github.com/liara-engine">GitHub</a> &middot;
            <a href="https://liara-engine.github.io/">All modules</a>
        </p>
        <p class="liara-doxygen-footer__generated">
            $generatedby &nbsp;Doxygen $doxygenversion
        </p>
    </div>
</footer>

</div><!-- /#top.liara-doxygen -->

</body>
</html>
