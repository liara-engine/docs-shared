<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>404 — Liara Engine</title>
    <meta name="description" content="This documentation page could not be found.">

    <link rel="icon" type="image/svg+xml" href="/shared-content/assets/logo.svg">

    <!-- Fonts: Inter, JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap">

    <!-- Liara design system -->
    <link rel="stylesheet" href="/shared-content/tokens/design-tokens.css">
    <link rel="stylesheet" href="/shared-content/navbar/navbar.css">

    <!-- Apply theme/a11y prefs synchronously to prevent flash -->
    <script>
        (function () {
            try {
                var t = localStorage.getItem("liara-theme");
                if (t === "light" || t === "dark") {
                    document.documentElement.setAttribute("data-liara-theme", t);
                }
                if (localStorage.getItem("liara-a11y-dyslexia") === "true") {
                    document.documentElement.setAttribute("data-liara-a11y-dyslexia", "true");
                }
            } catch (e) { /* localStorage unavailable, fall back to defaults */ }
        })();
    </script>

    <style>
        /* ====================================================================
         * 404 page — block prefix `nf-` (not-found).
         * Consumes Liara design tokens; no dependency on the hub stylesheet.
         * ==================================================================== */

        html, body {
            background: var(--liara-bg-page);
            color: var(--liara-text-primary);
            font-family: var(--liara-font-sans);
            line-height: var(--liara-leading-normal);
            margin: 0;
            padding: 0;
        }

        .nf {
            position: relative;
            min-height: calc(100vh - var(--liara-navbar-height));
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: var(--liara-space-8) var(--liara-space-5);
            box-sizing: border-box;
        }

        /* Soft pastel blobs, echoing the hub hero. */
        .nf__decor {
            position: absolute;
            inset: 0;
            overflow: hidden;
            z-index: 0;
            pointer-events: none;
        }

        .nf__blob {
            position: absolute;
            width: 480px;
            height: 480px;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.45;
        }

        .nf__blob--pink {
            background: var(--liara-brand-primary);
            top: -160px;
            right: -120px;
        }

        .nf__blob--lavender {
            background: var(--liara-brand-secondary);
            bottom: -180px;
            left: -140px;
            opacity: 0.35;
        }

        [data-liara-theme="dark"] .nf__blob { opacity: 0.25; }

        @media (prefers-color-scheme: dark) {
            :root:not([data-liara-theme="light"]) .nf__blob { opacity: 0.25; }
        }

        .nf__inner {
            position: relative;
            z-index: 1;
            max-width: 640px;
            text-align: center;
        }

        /* The signature: the status code itself, set in the mono face. */
        .nf__code {
            font-family: var(--liara-font-mono);
            font-weight: var(--liara-weight-bold);
            font-size: clamp(5rem, 18vw + 1rem, 11rem);
            line-height: 1;
            letter-spacing: -0.04em;
            color: var(--liara-brand-primary-dark);
            margin: 0;
            display: inline-flex;
            align-items: center;
            gap: 0.06em;
        }

        /* The middle digit gets the lavender treatment + a slow drift,
           so the "0" reads like something that floated off course. */
        .nf__code-zero {
            color: var(--liara-brand-secondary-dark);
            animation: nf-drift 6s ease-in-out infinite;
        }

        @keyframes nf-drift {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50%      { transform: translateY(-10px) rotate(-6deg); }
        }

        .nf__eyebrow {
            display: inline-flex;
            align-items: center;
            gap: var(--liara-space-2);
            background: var(--liara-brand-primary-soft);
            color: var(--liara-brand-primary-dark);
            padding: var(--liara-space-1) var(--liara-space-3);
            border-radius: var(--liara-radius-pill);
            font-size: var(--liara-text-xs);
            font-family: var(--liara-font-mono);
            font-weight: var(--liara-weight-medium);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin: 0 0 var(--liara-space-5);
        }

        .nf__title {
            font-size: var(--liara-text-2xl);
            font-weight: var(--liara-weight-bold);
            letter-spacing: -0.01em;
            margin: var(--liara-space-5) 0 var(--liara-space-3);
        }

        .nf__message {
            font-size: var(--liara-text-lg);
            color: var(--liara-text-secondary);
            line-height: var(--liara-leading-relaxed);
            max-width: 48ch;
            margin: 0 auto var(--liara-space-3);
            min-height: 3.4em; /* reserve space so the random line doesn't shift layout */
        }

        .nf__path {
            font-family: var(--liara-font-mono);
            font-size: var(--liara-text-sm);
            color: var(--liara-text-tertiary);
            background: var(--liara-bg-surface);
            border: var(--liara-border-width-thin) solid var(--liara-border-default);
            border-radius: var(--liara-radius-sm);
            padding: var(--liara-space-1) var(--liara-space-3);
            display: inline-block;
            max-width: 100%;
            overflow-wrap: anywhere;
            margin: 0 0 var(--liara-space-6);
        }

        .nf__cta {
            display: flex;
            flex-wrap: wrap;
            gap: var(--liara-space-3);
            justify-content: center;
        }

        .nf-button {
            display: inline-flex;
            align-items: center;
            gap: var(--liara-space-2);
            padding: var(--liara-space-3) var(--liara-space-5);
            border-radius: var(--liara-radius-md);
            font-size: var(--liara-text-base);
            font-weight: var(--liara-weight-medium);
            text-decoration: none;
            border: var(--liara-border-width-default) solid transparent;
            transition:
                    background-color var(--liara-transition-fast),
                    border-color var(--liara-transition-fast),
                    transform var(--liara-transition-fast);
            cursor: pointer;
        }

        .nf-button--primary {
            background: var(--liara-brand-primary-dark);
            color: var(--liara-text-on-primary);
            border-color: var(--liara-brand-primary-dark);
        }

        .nf-button--primary:hover {
            background: var(--liara-text-link-hover);
            border-color: var(--liara-text-link-hover);
            transform: translateY(-1px);
        }

        [data-liara-theme="dark"] .nf-button--primary {
            background: var(--liara-brand-primary);
            color: #1E1A1F;
            border-color: var(--liara-brand-primary);
        }

        @media (prefers-color-scheme: dark) {
            :root:not([data-liara-theme="light"]) .nf-button--primary {
                background: var(--liara-brand-primary);
                color: #1E1A1F;
                border-color: var(--liara-brand-primary);
            }
        }

        .nf-button--secondary {
            background: var(--liara-bg-elevated);
            color: var(--liara-text-primary);
            border-color: var(--liara-border-default);
        }

        .nf-button--secondary:hover {
            background: var(--liara-bg-surface);
            border-color: var(--liara-border-strong);
            transform: translateY(-1px);
        }

        @media (prefers-reduced-motion: reduce) {
            .nf__code-zero { animation: none; }
            .nf-button { transform: none !important; }
        }

        @media (max-width: 480px) {
            .nf__cta { flex-direction: column; align-items: stretch; }
            .nf-button { justify-content: center; }
        }
    </style>
</head>
<body>

<shared-navbar></shared-navbar>

<main class="nf">
    <div class="nf__decor" aria-hidden="true">
        <div class="nf__blob nf__blob--pink"></div>
        <div class="nf__blob nf__blob--lavender"></div>
    </div>

    <div class="nf__inner">
        <p class="nf__eyebrow">Error 404 — Page not found</p>

        <p class="nf__code" aria-hidden="true">
            4<span class="nf__code-zero">0</span>4
        </p>

        <h1 class="nf__title">Even Liara couldn't dig this one up.</h1>

        <p class="nf__message" data-nf-message>
            Either the URL took a wrong turn, or past-me forgot to write this page.
            Statistically, it's past-me.
        </p>

        <code class="nf__path" data-nf-path></code>

        <div class="nf__cta">
            <a class="nf-button nf-button--primary" href="/">Back to the hub</a>
            <a class="nf-button nf-button--secondary"
               href="https://github.com/liara-engine/liara/issues">Report a broken link</a>
        </div>
    </div>
</main>

<script src="/shared-content/navbar/navbar.config.js"></script>
<script src="/shared-content/hub/shared-navbar.js"></script>
<script defer src="/shared-content/navbar/navbar.js"></script>

<script>
    (function () {
        "use strict";

        const pathEl = document.querySelector("[data-nf-path]");
        if (pathEl) {
            const p = window.location.pathname + window.location.search;
            if (p && p !== "/") {
                pathEl.textContent = p;
            } else {
                pathEl.style.display = "none";
            }
        }

        const lines = [
            "Either the URL took a wrong turn, or past-me forgot to write this page. Statistically, it's past-me.",
            "I searched the whole repo for this page. Found three TODOs and a regret. No page.",
            "This page compiled cleanly, then vanished during a 2 a.m. refactor. Classic.",
            "The docs for this page are on my someday/maybe list. So is the someday/maybe list.",
            "Good news: zero memory leaks here. Bad news: also zero page.",
            "404: this link points somewhere that exists only in a branch I never pushed.",
            "This page is undefined behavior. Technically it could be anywhere. It's nowhere.",
            "Dereferenced a null pointer to get here. The pointer won.",
            "404: the one place where cache invalidation and naming things both failed at once.",
            "The Vulkan validation layers warned me about this link. I didn't listen.",
            "This route compiled and linked, then the linker quietly dropped the symbol.",
            "std::optional<Page> came back empty. As foretold.",
            "Off-by-one error in the URL. Or in reality. Hard to say.",
            "This page lives in a branch I rebased into oblivion.",
            "Schrödinger's page: written and not-written, until you clicked. Now it's not.",
            "Lost a race with the allocator. The page got freed first.",
            "No entity matches this URL in the ECS. The archetype is empty.",
            "The ABI changed and nobody recompiled this page.",
            "Dangling link. Points to memory that used to be a page.",
            "Stack overflow while searching for this page. Ironically, not the helpful kind.",
            "You found the edge of the map. There be dragons. And 404s.",
            "This page moved, was renamed, or never existed. The usual suspects.",
            "Nothing here yet. The docs are a work in progress, and so am I.",
            "This link is broken. Probably my fault. Almost certainly my fault.",
            "Wrong turn somewhere. Happens to the best of us, and to me especially.",
            "The page exists conceptually, which is more than most of my side projects achieve.",
            "The page you wanted isn't here, but the way back is one click away.",
            "The page was deprecated before it was implemented. Efficient.",
            "Looked everywhere. Found a coffee stain and an unfinished sentence. No page.",
            "404: this corner of the docs is still on the to-do list.",
            "This page was heavily optimized by the compiler. In fact, it was optimized out of existence.",
            "404: The pointer to this page returned nullptr, and honestly, I forgot to check it with an assert.",
            "We checked the cache. We checked the disk. We even ran 'git reflog'. This page is ghosts, chief.",
            "Good news: the build is green! Bad news: it skipped this page entirely to save time.",
            "I checked the roadmap. This page is somewhere between 'soon' and 'eventually'.",
            "The last commit mentioning this page ended with 'WIP'. Naturally.",
            "This URL is valid, but the content is currently trapped in a merge conflict that I am too afraid to resolve.",
            "A segmentation fault occurred while trying to think of what to put on this page. Core dumped.",
            "You found the secret level! Unfortunately, the secret level is completely untextured and empty.",
            "Legend says if you refresh this page 404 times, it still won't appear. Please don't test the legend.",
            "I could swear this page existed in a dream I had last Tuesday. Unfortunately, the server runs on reality.",
            "This URL has a great personality, but it currently lacks any form of HTML destination.",
            "The borrow checker refused to let me expose this page. It claimed ownership is ambiguous.",
            "RAII failed. The page was destroyed before your browser could even grab a reference to it.",
            "This page was replaced by a much better version that never got written.",
            "HEAD points somewhere. Unfortunately, not here.",
            "A deadlocked thread is currently holding the mutex for this page. We're both waiting.",
            "Divided by zero while calculating this URL's destination. Reality warped, page vanished.",
            "I traced the issue back to a decision made months ago. The trail ends with 'I'll fix it later'.",
            "404: This link is a hardcoded magic number that I promised myself I would refactor later. I didn't.",
            "This page was marked as inline, but the compiler decided to just delete it instead.",
            "This endpoint returned a 404 and, honestly, that's the most complete documentation here.",
            "The bit shifted the wrong way. You are now looking at an empty void.",
            "This page has been marked as 'easy to add' since approximately forever.",
            "The URL is valid. The destination is more of a suggestion.",
            "The content for this page is stuck in an infinite loop. If you wait here forever, it might load.",
            "404: The page exists, but only on my local machine. And my laptop is currently closed.",
            "I'm 99% sure this link worked yesterday. Then again, I'm also the person who wrote it, so don't trust that stat.",
            "The good news: you found a link! The bad news: it’s a dead end. Let’s focus on the journey.",
            "This page is currently undergoing a mid-life crisis. It's trying to find itself. For now, it's not here.",
            "This link was generated with 100% confidence and 0% testing.",
            "The proof that this page exists is trivial and has been left as an exercise for the user.",
            "This page crossed the event horizon. Not even photons can escape with its source code.",
            "The link works perfectly in an alternate timeline.",
            "The content has been deferred to a future version of myself. No ETA.",
            "I found the bug. It was assuming this page existed.",
            "404: feature not found, documentation not found, motivation not found.",
            "This URL evaluates to an imaginary number. The real part is absolute zero.",
            "Entropy won. This page has officially decayed into pure background radiation.",
            "We tried to warp to this destination, but we calculated the trajectory in radians instead of degrees.",
            "Houston, we have a problem. The page missed its orbital insertion and is drifting into deep space.",
            "Apparently this page was considered optional by both the build system and myself.",
            "Lithobraking successful! The page landed on the target planet, but at 4,000 meters per second.",
            "Solar flares disrupted the transmission. Or maybe I just forgot to upload the file. Let's blame the sun.",
            "The JavaScript helper for this page failed to bind to the DOM receptor. Natural selection at work.",
            "I think, therefore this page should be here. Sadly, the server operates on cold, hard determinism.",
            "This page is a social construct. There is no spoon, and there is certainly no HTML here.",
            "This is not the page you are looking for. You can go about your business. Move along.",
            "This page was snapped out of existence by a rogue infinity stone. I don't feel so good, Mr. Link.",
            "I found references to this page in four comments and one optimistic commit message.",
            "Great Scott! We went back to the future, but this page wasn't written in either timeline.",
            "A cosmic ray flipped a single bit in memory, and now this page is a void. Blame outer space.",
            "This route is currently locked behind a microtransaction that even I can't afford.",
            "The page is missing, but the analytical tracking scripts loaded perfectly. Priorities.",
        ];

        const msgEl = document.querySelector("[data-nf-message]");
        if (msgEl) {
            msgEl.textContent = lines[Math.floor(Math.random() * lines.length)];
        }
    })();
</script>

</body>
</html>
