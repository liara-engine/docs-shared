<!--
    Liara Engine — Shared Navbar (v2)

    Static HTML fragment to be embedded in every documentation page
    (Doxygen, mdBook, the central hub) via the {{{NAVBAR}}} placeholder
    handled by the docs-shared replacement processor.

    Structure:
        1. Main navbar (always visible): brand, modules, actions
        2. Sub-nav (revealed by JS only on module pages): module
           breadcrumb + view tabs (Developer guide / API reference)

    Module pills are populated dynamically by navbar.js from the
    registry and per-module manifests. The <ul.liara-navbar__modules>
    starts empty and is filled at runtime.

    Required external resources in the consuming page's <head>:

        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/opendyslexic@1.0.4/opendyslexic-regular.css">
        <link rel="stylesheet" href="<DOCS_SHARED_BASE>/tokens/design-tokens.css">
        <link rel="stylesheet" href="<DOCS_SHARED_BASE>/navbar/navbar.css">
        <script src="<DOCS_SHARED_BASE>/navbar/navbar.config.js"></script>
        <script defer src="<DOCS_SHARED_BASE>/navbar/navbar.js"></script>

    The order matters: navbar.config.js must load BEFORE navbar.js, and
    both must come AFTER the <link>s for the styles to apply before JS
    runs.
-->

<nav id="liara-navbar" class="liara-navbar" aria-label="Documentation navigation">
    <div class="liara-navbar__inner">

        <!-- Brand: logo + name, always links to the hub root -->
        <a class="liara-navbar__brand" data-liara-brand href="/" aria-label="Liara Engine home">
            <img class="liara-navbar__logo" src="{{{LOGO}}}" alt="" aria-hidden="true" width="24" height="24"/>
            <span class="liara-navbar__brand-name">Liara Engine</span>
        </a>

        <!--
            Modules list. Populated by navbar.js from the registry.
            Each <li> is a pill with two interactive areas: a link (the
            module name + current version) and a button (chevron to open
            the dropdown of versions).
        -->
        <ul class="liara-navbar__modules" data-liara-modules role="list">
            <!-- Filled in by JS. See navbar.js#renderModulePill. -->
        </ul>

        <!-- Pushes the actions to the right edge -->
        <div class="liara-navbar__spacer"></div>

        <!-- Action buttons: theme cycle, dyslexia toggle, GitHub link -->
        <div class="liara-navbar__actions">

            <button class="liara-navbar__action" type="button"
                    data-liara-theme-toggle
                    aria-label="Toggle color theme"
                    title="Toggle color theme">
                <svg class="liara-navbar__icon liara-navbar__icon--system" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
                    <rect x="3" y="5" width="18" height="13" rx="2" stroke="currentColor" stroke-width="1.6" fill="none"/>
                    <path d="M8 21h8M12 18v3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                </svg>
                <svg class="liara-navbar__icon liara-navbar__icon--light" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="12" cy="12" r="4" stroke="currentColor" stroke-width="1.6" fill="none"/>
                    <path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4l1.4-1.4M17 7l1.4-1.4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
                </svg>
                <svg class="liara-navbar__icon liara-navbar__icon--dark" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linejoin="round"/>
                </svg>
            </button>

            <button class="liara-navbar__action liara-navbar__action--text" type="button"
                    data-liara-a11y-toggle
                    aria-label="Toggle dyslexia-friendly mode"
                    aria-pressed="false"
                    title="Dyslexia-friendly mode">
                <span aria-hidden="true">Aa</span>
            </button>

            <a class="liara-navbar__action" data-liara-github
               href="https://github.com/liara-engine"
               aria-label="View on GitHub" title="View on GitHub"
               target="_blank" rel="noopener">
                <svg class="liara-navbar__icon" width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
                    <path fill="currentColor" d="M12 2A10 10 0 0 0 2 12c0 4.42 2.87 8.17 6.84 9.5.5.09.66-.22.66-.48v-1.7c-2.78.6-3.37-1.34-3.37-1.34-.45-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.6.07-.6 1 .07 1.53 1.03 1.53 1.03.89 1.53 2.34 1.09 2.91.83.09-.65.35-1.09.63-1.34-2.22-.25-4.55-1.11-4.55-4.94 0-1.09.39-1.98 1.03-2.68-.1-.25-.45-1.27.1-2.65 0 0 .84-.27 2.75 1.02a9.5 9.5 0 0 1 5 0c1.91-1.29 2.75-1.02 2.75-1.02.55 1.38.2 2.4.1 2.65.64.7 1.03 1.59 1.03 2.68 0 3.84-2.34 4.69-4.57 4.94.36.31.68.92.68 1.85V21c0 .27.16.58.67.48A10 10 0 0 0 22 12 10 10 0 0 0 12 2z"/>
                </svg>
            </a>

        </div>

        <!-- Mobile menu toggle. Visible only below 768px via CSS. -->
        <button class="liara-navbar__menu-toggle" type="button"
                data-liara-menu-toggle
                aria-label="Open menu" aria-expanded="false">
            <span class="liara-navbar__menu-toggle-bar"></span>
            <span class="liara-navbar__menu-toggle-bar"></span>
            <span class="liara-navbar__menu-toggle-bar"></span>
        </button>

    </div>
</nav>

<!--
    Sub-nav (contextual). Hidden by default; navbar.js reveals it on
    URLs that match a module page and highlights the active view tab
    (book = developer guide, doxygen = API reference). On the hub,
    user guide, or any other non-module page, this stays hidden.
-->
<div class="liara-navbar-subnav" id="liara-navbar-subnav"
     data-liara-subnav hidden aria-label="Documentation view">
    <div class="liara-navbar-subnav__inner">

        <div class="liara-navbar-subnav__breadcrumb">
            <span class="liara-navbar-subnav__module" data-liara-subnav-module></span>
            <span class="liara-navbar-subnav__sep" aria-hidden="true">/</span>
            <span class="liara-navbar-subnav__version" data-liara-subnav-version></span>
        </div>

        <div class="liara-navbar-subnav__tabs" role="tablist">
            <a class="liara-navbar-subnav__tab" data-liara-subnav-tab="book"
               role="tab" aria-selected="false" href="#">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
                    <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
                </svg>
                <span>Developer guide</span>
            </a>
            <a class="liara-navbar-subnav__tab" data-liara-subnav-tab="doxygen"
               role="tab" aria-selected="false" href="#">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <polyline points="16 18 22 12 16 6"/>
                    <polyline points="8 6 2 12 8 18"/>
                </svg>
                <span>API reference</span>
            </a>
        </div>

    </div>
</div>
