name: clean-ghcr
on:
  schedule:
    - cron: '0 0 * * 0'  # Runs every Sunday at midnight
  workflow_dispatch:

jobs:
  clean:
    permissions:
      contents: read
      packages: write

    uses: liara-engine/.github/.github/workflows/reusable-clean-ghcr.yml@v2
    with:
      package-name: liara-documentation-builder
      min-versions-to-keep: 3