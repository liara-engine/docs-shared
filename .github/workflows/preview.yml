name: preview

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

concurrency:
  group: preview-${{ github.event.number }}
  cancel-in-progress: true

env:
  SITE: https://liara-engine.liara-engine-documentation.workers.dev

jobs:
  build:
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build the builder from this pull request
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          load: true
          push: false
          tags: liara-documentation-builder:pr-${{ github.event.number }}
          cache-from: type=gha,scope=docs-builder
          cache-to: type=gha,scope=docs-builder,mode=max
          provenance: false
          sbom: false

      - name: Build the fixtures with it
        env:
          IMAGE: liara-documentation-builder:pr-${{ github.event.number }}
          LIARA_DOCS_REPO: docs-shared
          LIARA_DOCS_VERSION: pr-${{ github.event.number }}
          LIARA_DOCS_SITE: ${{ env.SITE }}
          LIARA_ASSETS_PREFIX: /_cas/
        run: |
          set -euo pipefail
          mkdir -p out

          docker run --rm \
            -v "${PWD}/tests/fixtures:/src" \
            -v "${PWD}/out:/out" \
            -e LIARA_DOCS_REPO \
            -e LIARA_DOCS_VERSION \
            -e LIARA_DOCS_SITE \
            -e LIARA_ASSETS_PREFIX \
            "$IMAGE" --output /out/site

          sudo chown -R "$(id -u):$(id -g)" out

      - name: Describe the build
        env:
          VERSION: pr-${{ github.event.number }}
        run: |
          set -euo pipefail
          [ -d out/site ] || { echo "::error::the builder produced no site"; exit 1; }

          cp out/site/manifest.json out/manifest.json
          jq -n --arg version "$VERSION" \
            '{repo: "docs-shared", version: $version, root: false}' > out/deploy.json

      - uses: actions/upload-artifact@v7
        with:
          name: docs
          path: out
          include-hidden-files: true
          retention-days: 7

  publish:
    needs: build

    permissions:
      contents: read

    uses: liara-engine/.github/.github/workflows/reusable-deploy-docs.yml@v2
    with:
      output-repository: liara-engine/liara-docs
      update-manifest: never
      docs-shared-ref: main

    secrets:
      push-token: ${{ secrets.DOCS_PUSH_TOKEN }}
      read-token: ${{ secrets.ORG_READ_TOKEN }}

  comment:
    needs: publish
    runs-on: ubuntu-24.04

    permissions:
      pull-requests: write

    steps:
      - uses: marocchino/sticky-pull-request-comment@v3.0.5
        with:
          header: docs-shared-preview
          message: |
            **Docs-shared preview** — the test fixtures, built with *this PR's*
            builder image (preset, styles, build script and site tools included):

            ${{ env.SITE }}/docs-shared/pr-${{ github.event.number }}/

            <sub>Rebuilt on every push · removed automatically when the PR closes.</sub>
