name: rebuild-version

# Rebuilds published versions of one module, on demand.
#
# The site is a pile of frozen builds: a version directory is written once and
# then never touched again, which is what makes an old URL keep working. The
# cost is that a change to the shared templates only reaches the versions that
# happen to be rebuilt afterwards — `dev` and `latest` are refreshed on every
# docs-shared release (see image.yml), and everything older is this workflow's
# job.
#
# The canonical manifest — what `/<module>/latest/` resolves through — is left
# alone unless the rebuilt version is the one it already calls latest, so
# rebuilding an old release cannot roll `latest` backwards. With a list, that
# rule applies per version, exactly as it did one at a time.

on:
  workflow_dispatch:
    inputs:
      module:
        description: 'Module repository name, e.g. liara-core'
        required: true
        type: string

      version:
        description: 'Versions to rebuild, separated by commas, spaces or newlines: dev, or X.Y.Z (built from the tag vX.Y.Z)'
        required: true
        type: string

      ref:
        description: 'Override the ref to build (default: the default branch for dev, vX.Y.Z otherwise). Applies to every version in the list, so it is only meaningful for one.'
        required: false
        type: string
        default: ''

      image:
        description: 'Builder image to build with'
        required: false
        type: string
        default: ghcr.io/liara-engine/liara-documentation-builder:latest

      update-manifest:
        description: 'Whether this build becomes the module''s canonical manifest'
        required: false
        type: choice
        default: auto
        options: [auto, always, never]

      skip-api:
        description: 'Build the prose only, even if the module ships a Doxyfile'
        required: false
        type: boolean
        default: false

      max-parallel:
        description: 'How many versions to build at once (each ends in a push to liara-docs)'
        required: false
        type: string
        default: '3'

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.parse.outputs.versions }}
      count: ${{ steps.parse.outputs.count }}

    steps:
      - id: parse
        env:
          RAW: ${{ inputs.version }}
          MODULE: ${{ inputs.module }}
        run: |
          set -Eeuo pipefail

          mapfile -t versions < <(
            printf '%s' "$RAW" | tr ',\r\n' '   ' | tr -s ' ' '\n' \
              | sed '/^$/d' | awk '!seen[$0]++'
          )

          if [ "${#versions[@]}" -eq 0 ]; then
            echo "::error::no version to rebuild: \`version\` was empty once separators were stripped"
            exit 1
          fi

          for version in "${versions[@]}"; do
            if [[ ! "$version" =~ ^(dev|[0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
              echo "::error::\`$version\` is not a version this workflow can build: expected \`dev\` or \`X.Y.Z\`"
              exit 1
            fi
          done

          if [ "${#versions[@]}" -gt 256 ]; then
            echo "::error::${#versions[@]} versions requested; a matrix holds at most 256"
            exit 1
          fi

          printf 'versions=%s\n' "$(printf '%s\n' "${versions[@]}" | jq -R . | jq -c -s .)" >> "$GITHUB_OUTPUT"
          printf 'count=%s\n' "${#versions[@]}" >> "$GITHUB_OUTPUT"

          {
            printf '### Rebuilding %d version(s) of `%s`\n' "${#versions[@]}" "$MODULE"
            printf -- '- `%s`\n' "${versions[@]}"
          } >> "$GITHUB_STEP_SUMMARY"

  rebuild:
    needs: plan

    permissions:
      contents: read
      packages: read

    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.max-parallel) }}
      matrix:
        version: ${{ fromJSON(needs.plan.outputs.versions) }}

    uses: liara-engine/.github/.github/workflows/reusable-docs.yml@v2
    with:
      image: ${{ inputs.image }}
      output-repository: liara-engine/liara-docs
      source-repository: liara-engine/${{ inputs.module }}
      source-ref: ${{ inputs.ref }}
      repo: ${{ inputs.module }}
      version: ${{ matrix.version }}
      update-manifest: ${{ inputs.update-manifest }}
      skip-api: ${{ inputs.skip-api }}

    secrets:
      ghcr-token: ${{ secrets.GITHUB_TOKEN }}
      push-token: ${{ secrets.DOCS_PUSH_TOKEN }}
      read-token: ${{ secrets.ORG_READ_TOKEN }}
