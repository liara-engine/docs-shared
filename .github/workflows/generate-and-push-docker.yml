name: Generate and Push Docker Images

on:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'
    paths:
      - '.github/workflows/generate-and-push-docker.yml'
      - 'docker/**'
      - 'mdbook/**'
      - 'doxygen/**'
      - 'shared-content/assets/**'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'docker/**'
      - 'mdbook/**'
      - 'doxygen/**'
      - 'shared-content/assets/**'
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: read
      packages: write

    uses: liara-engine/.github/.github/workflows/reusable-generate-docker.yml@v1

    with:
      target: liara-documentation-builder
      image-name: liara-engine/liara-documentation-builder
      dockerfile-path: docker/liara-documentation-builder/Dockerfile
      # Tags the image `pr-<n>` for PR previews, the release tag itself
      # (e.g. `v1.2.3`) on a release-please tag push, or `dev` on any other
      # push to main — the same scheme `docs.yml` uses for
      # `deployment-version`, so the docker image's version always matches
      # the docs-shared version it was built from without anyone having to
      # keep the two in sync by hand.
      image-tag: >-
        ${{ github.event_name == 'pull_request'
            && format('pr-{0}', github.event.pull_request.number)
            || (github.ref_type == 'tag' && github.ref_name || 'dev') }}
      # `latest` tracks every push (branch or release tag) so the image
      # consumed by docs.yml / deploy-shared.yml / deploy-hub.yml /
      # deploy-preview.yml never goes stale relative to main — only PR
      # preview builds are excluded.
      tag-latest: ${{ github.event_name != 'pull_request' }}