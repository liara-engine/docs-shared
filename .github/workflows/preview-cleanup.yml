name: preview-cleanup
on:
  pull_request:
    types: [closed]

permissions:
  contents: read

jobs:
  cleanup:
    uses: liara-engine/.github/.github/workflows/reusable-docs-preview-cleanup.yml@v1
    with:
      output-repository: liara-engine/liara-docs
    secrets:
      push-token: ${{ secrets.DOCS_PUSH_TOKEN }}
