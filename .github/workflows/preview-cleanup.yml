name: preview-cleanup
on:
  pull_request:
    types: [closed]

jobs:
  docs:
    permissions:
      contents: read

    uses: liara-engine/.github/.github/workflows/reusable-docs-preview-cleanup.yml@v1
    with:
      output-repository: liara-engine/liara-docs
    secrets:
      push-token: ${{ secrets.DOCS_PUSH_TOKEN }}

  docker:
    runs-on: ubuntu-24.04

    permissions:
      packages: write

    env:
      ORG: liara-engine
      PACKAGE: liara-documentation-builder
      TAG: pr-${{ github.event.number }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Delete preview image version
        run: |
          set -euo pipefail
          version_id=$(gh api \
            "/orgs/${ORG}/packages/container/${PACKAGE}/versions" \
            --paginate \
            --jq ".[] | select(.metadata.container.tags[]? == \"${TAG}\") | .id" \
            | head -n1)

          if [ -z "${version_id}" ]; then
            echo "No image version tagged ${TAG}; nothing to delete."
            exit 0
          fi

          gh api --method DELETE \
            "/orgs/${ORG}/packages/container/${PACKAGE}/versions/${version_id}"
          echo "Deleted ${PACKAGE} version ${version_id} (was tagged ${TAG})."
